name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-ci:
    name: deterministic-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify Python
        shell: bash
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'

      - name: Install uv
        shell: bash
        run: python3 -m pip install --disable-pip-version-check "uv==0.12.5"

      - name: Run canonical CI gate
        shell: bash
        run: bash scripts/ci.sh
